# .sutra/rules.toml — Architectural constraints for yojana
#
# Severity levels:
#   blocking      — guard denies edits that introduce these
#   advisory      — warning in review, agent proceeds
#   informational — tracked in review output, silent otherwise
#
# Provenance sources:
#   docs/yojana-design.md — the design doc (storage, purity, tool surface)
#   CLAUDE.md             — agent skill routing
#   Cargo.toml            — [lints.clippy] baseline

# ═══════════════════════════════════════════════════════════════════
# Storage discipline
# ═══════════════════════════════════════════════════════════════════
# The design doc is explicit: SQLite, local-first, one DB per yojana root.
# Postgres was considered and rejected (only chitta needs it, for pgvector).
# Introducing a server database would change the deployment story for every
# manas consumer.

[[constraint]]
kind = "forbidden_external"
crates = ["postgres", "tokio-postgres", "sqlx", "diesel", "sea-orm", "deadpool-postgres"]
name = "no-server-database"
severity = "blocking"
provenance = "docs/yojana-design.md § storage decision: SQLite, not Postgres"

# Storage access is a single layer: rusqlite stays behind db.rs, with error.rs
# translating its error type. Anything else reaching for the driver directly
# means a query has escaped the storage boundary.

[[constraint]]
kind = "confined_external"
crates = ["rusqlite"]
allowed_in = ["src/db.rs", "src/error.rs"]
name = "sqlite-behind-db-layer"
severity = "blocking"
provenance = "docs/yojana-design.md § storage decision: SQLite, not Postgres"

# ═══════════════════════════════════════════════════════════════════
# Server purity
# ═══════════════════════════════════════════════════════════════════
# "Yojana validates the shape but does not resolve refs. Resolution happens
# in manas-cli (per principle 9 — every cross-tier compound op lives in
# manas-cli, never inside a subsystem server). Yojana's binary stays a pure
# task-graph server."
#
# There are no sibling-crate deps today; this is a tripwire, not a fix.

[[constraint]]
kind = "forbidden_external"
crates = ["chitta*", "sutra*", "smriti*", "sangha*", "kosha*"]
name = "no-cross-tier-clients"
severity = "blocking"
provenance = "docs/yojana-design.md § context_refs — resolution lives in manas-cli"

# ═══════════════════════════════════════════════════════════════════
# Layering
# ═══════════════════════════════════════════════════════════════════
# Observed layers (from the import graph):
#   infra   error.rs, config.rs, state.rs
#   data    db.rs
#   domain  graph.rs, context.rs
#   tools   src/tools/*, mcp.rs
#   entry   main.rs, display.rs
#
# The domain layer must not depend on the tool layer: tools/ marshals the MCP
# wire surface and sits downstream of domain. Domain types that were once
# addressed through tools/ (ContextRef/RefType, acceptance parsing) now live in
# their own crate-root modules (src/context_ref.rs, src/acceptance.rs), so this
# constraint holds with no exceptions to grandfather.

[[constraint]]
kind = "forbidden_dep"
from = "src/context.rs"
to = "src/tools/**"
name = "domain-must-not-import-tools"
severity = "blocking"
provenance = "layering invariant — domain (context.rs) sits upstream of the tool layer and must not import from it"

[[constraint]]
kind = "max_fan_in"
target = "src/tools/task.rs"
threshold = 10
name = "task-tool-fan-in"
severity = "advisory"

# ═══════════════════════════════════════════════════════════════════
# Pattern discipline — vidhi/language-rules/rust.toml
# ═══════════════════════════════════════════════════════════════════
# Full catalog adopted. Guard uses introduced-only semantics: pre-existing
# matches are grandfathered, so these fire on new code, not on history.
#
# Duplicate-rule principle: a forbidden_pattern that duplicates a clippy lint
# already in Cargo.toml [lints.clippy] must be blocking, or it should not
# exist. At advisory it is the same warning twice. Blocking buys edit-time
# interception, which clippy structurally cannot provide. no-unwrap and
# no-todo-unimplemented are the two duplicates (unwrap_used, todo,
# unimplemented); both are blocking, and clippy stays at warn as the backstop
# for code sutra's scope does not cover.
#
# Test code is excluded from these on both the review and guard paths
# (sutra/290), so blocking does not obstruct `.unwrap()` inside
# #[cfg(test)] modules. Verified 2026-07-25: zero production matches for
# either rule.

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '(call_expression function: (field_expression field: (field_identifier) @m (#eq? @m "clone"))) @match'
scope = "src/"
name = "no-clone-driven-dev"
severity = "advisory"
provenance = "vidhi/language-rules/rust.toml — No Clone-Driven Development"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '(call_expression function: (field_expression field: (field_identifier) @m (#eq? @m "to_owned"))) @match'
scope = "src/"
name = "no-to-owned-bypass"
severity = "advisory"
provenance = "vidhi/language-rules/rust.toml — No Clone-Driven Development"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '''
(attribute_item (attribute (identifier) @m (#eq? @m "allow"))) @match
(inner_attribute_item (attribute (identifier) @m (#eq? @m "allow"))) @match
'''
scope = "src/"
name = "no-allow-attributes"
severity = "blocking"
provenance = "vidhi/language-rules/rust.toml — Lint layer tamper-resistance"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '(unsafe_block) @match'
scope = "src/"
name = "unsafe-requires-waiver"
severity = "advisory"
provenance = "vidhi/language-rules/rust.toml — Unsafe blocks carry an audited safety argument"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '(macro_invocation macro: (identifier) @m (#match? @m "^(todo|unimplemented)$")) @match'
scope = "src/"
name = "no-todo-unimplemented"
severity = "blocking"
provenance = "vidhi/language-rules/rust.toml — No stubbed control flow in committed code"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '(call_expression function: (field_expression field: (field_identifier) @m (#eq? @m "unwrap"))) @match'
scope = "src/"
name = "no-unwrap"
severity = "blocking"
provenance = "vidhi/language-rules/rust.toml — Panics carry invariant messages"

# ═══════════════════════════════════════════════════════════════════
# Export serializer purity — checkpoint:yojana/53 (2026-08-06)
# ═══════════════════════════════════════════════════════════════════
# manifest.rs is the deep, pure module of the export subsystem: TaskRow -> bytes,
# no I/O. writer.rs owns all filesystem access. rusqlite is already confined to
# db.rs (sqlite-behind-db-layer), so this guards the remaining escape hatch —
# direct std filesystem/process I/O leaking into the serializer as the records
# layer (yojana/51 I4/I11/I13) grows it. Clean at authoring time (manifest.rs
# imports only serde + crate::db::TaskRow), so blocking, not advisory.

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '(scoped_identifier path: (identifier) @s name: (identifier) @f (#eq? @s "std") (#match? @f "^(fs|io|net|process)$")) @match'
scope = "src/export/manifest.rs"
name = "serializer-no-io"
severity = "blocking"
provenance = "docs/yojana-design.md § purity — manifest is a pure TaskRow->bytes serializer; writer.rs owns I/O"
